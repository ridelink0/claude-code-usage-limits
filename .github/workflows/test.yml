name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # This reads home directories and joins paths, so the platform matters
    # more than it would for a pure library.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: node --test

      - name: Check the CLI starts
        run: node bin/cli.js --version
